# Official-detector validation configuration.
# Every detector is disabled by default because its upstream package may
# download model weights. Use --dry-run locally or run the Colab workflow.

ollama:
  host: "http://localhost:11434"
  timeout: 120

# SelfCheckGPT alone needs repeated generations. Point this entry at an LLM
# server on another machine, or replace it with the API example below.
#
# Cross-lab, fast-model set for detector research (avoid single-vendor bias).
# Verify every tag with `ollama pull <tag>` on the research machine first —
# some names below (esp. deepseek-r1, gemma3) may have newer successors by
# the time you run this; check `ollama list` / ollama.com/library.
models:
  - name: "llama3.2-3b"       # Meta
    provider: "ollama"
    model: "llama3.2:3b"
    auto_pull: false

  - name: "qwen2.5-7b"        # Alibaba
    provider: "ollama"
    model: "qwen2.5:7b"
    auto_pull: false

  - name: "deepseek-r1-7b"    # DeepSeek (Qwen-distilled reasoning model)
    provider: "ollama"
    model: "deepseek-r1:7b"
    auto_pull: false

  - name: "gemma3-4b"         # Google
    provider: "ollama"
    model: "gemma3:4b"
    auto_pull: false

  - name: "gpt-oss-20b"       # OpenAI (open-weight, MoE — fast despite size)
    provider: "ollama"
    model: "gpt-oss:20b"
    auto_pull: false

selected_models: ["llama3.2-3b", "qwen2.5-7b", "deepseek-r1-7b", "gemma3-4b", "gpt-oss-20b"]

datasets:
  - name: "halueval_qa"
    enabled: false
    source: "json"
    path: "external_data/HaluEval/data/qa_data.json"
    max_samples: 50
    context_col: "knowledge"
    question_col: "question"
    right_answer_col: "right_answer"
    hallucinated_answer_col: "hallucinated_answer"

  # Engineering smoke data only; do not report it as a research result.
  - name: "synthetic"
    enabled: true
    source: "synthetic"
    max_samples: 8

detectors:
  selfcheckgpt:
    enabled: false
    method: "ngram"       # ngram is lightest; nli is the stronger checkpoint method
    threshold: 3.0        # ngram score is unbounded; calibrate on validation data
    n_samples: 5
    temperature: 1.0
    device: "cpu"

  summac:
    enabled: false
    threshold: 0.5
    device: "cpu"
    model_name: "vitc"

  minicheck:
    enabled: false
    threshold: 0.5
    model_name: "flan-t5-large"
    cache_dir: "external_models/minicheck"

  alignscore:
    enabled: false
    threshold: 0.5
    checkpoint_path: "external_models/alignscore/AlignScore-base.ckpt"
    device: "cpu"
    model_name: "roberta-base"

# Stage B: local-inspired reduction baseline, scored with the SAME frozen
# SelfCheckGPT detector configured above. Not an upstream reproduction — see
# `self_refine` in provenance/sources.yaml and docs/MITIGATION_METHODS.md.
# Disabled by default; enable with --reduce or reduction.enabled: true.
reduction:
  enabled: false
  # "_adapted" is not decorative: the code refuses "self_refine" alone so this
  # can never be quoted as plain, unqualified "Self-Refine" in a results table.
  method: "self_refine_adapted"
  detector: "selfcheckgpt"   # only supported value today
  max_iterations: 3

benchmark:
  output_dir: "results/current"
  seed: 42

logging:
  level: "INFO"
