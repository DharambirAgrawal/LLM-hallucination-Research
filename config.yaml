# Official-detector validation configuration.
# Every detector is disabled by default because its upstream package may
# download model weights. Use --dry-run locally or run the Colab workflow.

ollama:
  host: "http://localhost:11434"
  timeout: 120

# SelfCheckGPT alone needs repeated generations. Point this entry at an LLM
# server on another machine, or replace it with the API example below.
models:
  - name: "remote-ollama"
    provider: "ollama"
    model: "llama3.2:3b"
    auto_pull: false

selected_models: ["remote-ollama"]

datasets:
  - name: "halueval_qa"
    enabled: false
    source: "json"
    path: "external_data/HaluEval/data/qa_data.json"
    max_samples: 50
    context_col: "knowledge"
    question_col: "question"
    right_answer_col: "right_answer"
    hallucinated_answer_col: "hallucinated_answer"

  # Engineering smoke data only; do not report it as a research result.
  - name: "synthetic"
    enabled: true
    source: "synthetic"
    max_samples: 8

detectors:
  selfcheckgpt:
    enabled: false
    method: "ngram"       # ngram is lightest; nli is the stronger checkpoint method
    threshold: 3.0        # ngram score is unbounded; calibrate on validation data
    n_samples: 5
    temperature: 1.0
    device: "cpu"

  summac:
    enabled: false
    threshold: 0.5
    device: "cpu"
    model_name: "vitc"

  minicheck:
    enabled: false
    threshold: 0.5
    model_name: "flan-t5-large"
    cache_dir: "external_models/minicheck"

  alignscore:
    enabled: false
    threshold: 0.5
    checkpoint_path: "external_models/alignscore/AlignScore-base.ckpt"
    device: "cpu"
    model_name: "roberta-base"

benchmark:
  output_dir: "results/current"
  seed: 42

logging:
  level: "INFO"
