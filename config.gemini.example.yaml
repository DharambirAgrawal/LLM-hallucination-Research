# Remote Gemini generator for official SelfCheckGPT sampling.
# The API key is loaded from the ignored .env file or process environment.
models:
  - name: "gemini-flash-lite"
    provider: "openai_compatible"
    model: "gemini-3.5-flash-lite"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GEMINI_API_KEY"
    timeout: 120
    temperature: 1.0
    max_tokens: 96

selected_models: ["gemini-flash-lite"]

datasets:
  - name: "synthetic"
    enabled: true
    source: "synthetic"
    max_samples: 2

detectors:
  selfcheckgpt:
    enabled: true
    method: "ngram"
    threshold: 3.0  # smoke placeholder; calibrate on validation data
    n_samples: 2
    temperature: 1.0
    device: "cpu"
  summac: {enabled: false}
  minicheck: {enabled: false}
  alignscore: {enabled: false}

benchmark:
  output_dir: "results/gemini-smoke"
  seed: 42
